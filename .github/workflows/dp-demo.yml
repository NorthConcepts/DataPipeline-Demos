name: Java CI

on:
  schedule:
    - cron: '30 13 15 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file ./DataPipeline-Demo-Build-with-Maven/pom.xml

  build-gradle:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        demo:
          - Data-Ingestion-Pipeline
          - DataPipeline-Demo-Replace-Log4j-with-SLF4J-in-Gradle
          - DataPipeline-Integration-Orc-Upgrade-Libraries
          - Export-CSV-and-Excel-from-Java-web-apps
          - Import-CSV-and-Excel-to-Java-Web-Apps

    defaults:
      run:
        working-directory: ${{ matrix.demo }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
